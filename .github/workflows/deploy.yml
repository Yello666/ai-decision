name: Deploy FastAPI to Aliyun ECS

on:
  push:
    branches: [ "master" ]

env:
  ACR_REPO: crpi-t0hvxqzt2j7j9l7n.cn-chengdu.personal.cr.aliyuncs.com/emily1103/shop-ai
  ACR_REGISTRY: crpi-t0hvxqzt2j7j9l7n.cn-chengdu.personal.cr.aliyuncs.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code  # 强制清除缓存，拉取最新代码
        uses: actions/checkout@v4
        with:
          clean: true          # 清空本地修改
          fetch-depth: 0       # 拉取完整历史
          persist-credentials: false

      - name: 强制同步远程代码（解决回退不生效）
        run: |
          git fetch origin
          git reset --hard origin/master
          git clean -fd

      - name: Login to ACR
        uses: aliyun/acr-login@v1
        with:
          login-server: https://${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          # 重点：加了 --no-cache 强制重新构建，不使用旧缓存
          docker build --no-cache -t ${{ env.ACR_REPO }}:${{ github.sha }} .
          docker tag ${{ env.ACR_REPO }}:${{ github.sha }} ${{ env.ACR_REPO }}:latest
          
          docker push ${{ env.ACR_REPO }}:${{ github.sha }}
          docker push ${{ env.ACR_REPO }}:latest

  deploy-to-ecs:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy to ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker login --username=${{ secrets.ACR_USERNAME }} --password=${{ secrets.ACR_PASSWORD }} ${{ env.ACR_REGISTRY }}
            
            docker stop shop-ai || true
            docker rm shop-ai || true
            
            # 关键：用 commit 版本号拉取，绝对不会用缓存！
            docker pull ${{ env.ACR_REPO }}:${{ github.sha }}
            
            docker run -d \
              --name shop-ai \
              -p 8000:8000 \
              -v $(pwd)/.env:/app/.env \
              --restart always \
              ${{ env.ACR_REPO }}:${{ github.sha }}