name: Deploy FastAPI to Aliyun ECS

on:
  push:
    branches: [ "master" ]

env:
  ACR_REPO: crpi-t0hvxqzt2j7j9l7n.cn-chengdu.personal.cr.aliyuncs.com/emily1103/shop-ai
  ACR_REGISTRY: crpi-t0hvxqzt2j7j9l7n.cn-chengdu.personal.cr.aliyuncs.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 确保能获取到回退后的所有提交历史

      - name: Login to ACR
        uses: aliyun/acr-login@v1
        with:
          login-server: https://${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          # 1. 强制不使用缓存构建
          # 2. 这里的 github.sha 对应你当前 commit 的哈希值（回退后的那个）
          docker build --no-cache -t ${{ env.ACR_REPO }}:${{ github.sha }} .
          
          # 推送具体的 SHA 标签（这是唯一的身份证明）
          docker push ${{ env.ACR_REPO }}:${{ github.sha }}
          
          # 也可以更新 latest，但部署时不建议只依赖它
          docker tag ${{ env.ACR_REPO }}:${{ github.sha }} ${{ env.ACR_REPO }:latest
          docker push ${{ env.ACR_REPO }:latest

  deploy-to-ecs:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy to ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker login --username=${{ secrets.ACR_USERNAME }} --password=${{ secrets.ACR_PASSWORD }} ${{ env.ACR_REGISTRY }}
            
            # 停止并删除旧容器
            docker stop shop-ai || true
            docker rm shop-ai || true
            
            # 【关键改动】删除 ECS 本地可能存在的该 SHA 标签镜像，强制重新拉取
            docker rmi ${{ env.ACR_REPO }}:${{ github.sha }} || true
            
            # 拉取刚刚构建好的、对应回退后版本的镜像
            docker pull ${{ env.ACR_REPO }}:${{ github.sha }}
            
            # 启动容器
            docker run -d \
              --name shop-ai \
              -p 8000:8000 \
              -v $(pwd)/.env:/app/.env \
              --restart always \
              ${{ env.ACR_REPO }}:${{ github.sha }}
            
            # 清理无用镜像（虚悬镜像），释放空间
            docker image prune -f