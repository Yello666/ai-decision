name: Deploy FastAPI to Aliyun ECS

on:
  push:
    branches: [ "master" ]

env:
  ACR_REPO: crpi-t0hvxqzt2j7j9l7n.cn-chengdu.personal.cr.aliyuncs.com/emily1103/shop-ai
  ACR_REGISTRY: crpi-t0hvxqzt2j7j9l7n.cn-chengdu.personal.cr.aliyuncs.com

jobs:
  build-and-push:
    if: github.repository == 'Yello666/ai-decision'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to ACR
        uses: aliyun/acr-login@v1
        with:
          login-server: https://${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          # 强制重新构建，防止旧代码残留
          docker build --no-cache -t ${{ env.ACR_REPO }}:${{ github.sha }} .
          
          # 推送具体版本号镜像
          docker push ${{ env.ACR_REPO }}:${{ github.sha }}
          
          # 更新并推送 latest 标签
          docker tag ${{ env.ACR_REPO }}:${{ github.sha }} ${{ env.ACR_REPO }}:latest
          docker push ${{ env.ACR_REPO }}:latest

  deploy-to-ecs:
    if: github.repository == 'Yello666/ai-decision'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy to ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker login --username=${{ secrets.ACR_USERNAME }} --password=${{ secrets.ACR_PASSWORD }} ${{ env.ACR_REGISTRY }}
            
            # 停止并清理旧容器
            docker stop shop-ai || true
            docker rm shop-ai || true
            
            # 【强制刷新】删除本地可能存在的同名旧镜像，确保 pull 动作真正发生
            docker rmi ${{ env.ACR_REPO }}:${{ github.sha }} || true
            docker system prune -a -f
            # 使用 Commit SHA 确保版本严格一致
            docker pull ${{ env.ACR_REPO }}:${{ github.sha }}
            
            docker run -d \
              --name shop-ai \
              -p 8000:8000 \
              -v $(pwd)/.env:/app/.env \
              --restart always \
              ${{ env.ACR_REPO }}:${{ github.sha }}
            
            # 清理虚悬镜像
            docker image prune -f